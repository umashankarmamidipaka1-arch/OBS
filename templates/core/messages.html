{% for message in messages %}
<div class="max-w-4xl mx-auto mt-4 px-4 py-3.5 rounded-xl border flex items-start space-x-3 shadow-2xl backdrop-blur-md transition-all duration-300 {% if 'error' in message.tags or 'danger' in message.tags %}bg-red-950/40 border-red-500/30 text-red-200{% else %}bg-teal-950/40 border-teal-500/30 text-teal-200{% endif %}" role="alert">
    <div class="flex-shrink-0 mt-0.5">
        {% if 'error' in message.tags or 'danger' in message.tags %}
            <svg class="h-5 w-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/>
            </svg>
        {% else %}
            <svg class="h-5 w-5 text-teal-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
        {% endif %}
    </div>
    <div class="flex-grow">
        <p class="text-sm font-semibold tracking-wide capitalize">
            {% if 'error' in message.tags or 'danger' in message.tags %}Alert{% else %}Notification{% endif %}
        </p>
        <p class="text-xs text-slate-300 mt-0.5 leading-relaxed">{{ message }}</p>
    </div>
    <button onclick="this.parentElement.remove()" class="flex-shrink-0 text-slate-400 hover:text-white transition-colors duration-150">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
    </button>
</div>
{% endfor %}
